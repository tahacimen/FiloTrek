name: Keep Supabase awake

# Hits the production health endpoint daily so the database sees regular
# activity and the free-tier Supabase project does not auto-pause after ~7
# days of inactivity (which takes the whole site — including login — down
# until it is manually restored). Scheduled workflows run only from the
# default branch. Also runnable on demand from the Actions tab.
on:
  schedule:
    - cron: "0 6 * * *" # every day at 06:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          url="https://logigotr.com/api/health"
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$url" || echo 000)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Database pinged successfully."
              exit 0
            fi
            sleep 20
          done
          echo "Health endpoint did not return 200 after retries."
          exit 1
